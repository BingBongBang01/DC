  디시 `comment.js`(v260803) 가 실제로 만들어내는 문자열 구조를 그대로 옮긴 것이다.

  ★ 핵심: depth 0 댓글의 <li> 는 답글이 뒤따를 때 *닫히지 않는다*.
    comment.js:257  if(comment_start && (마지막이거나 다음 항목에 c_no 가 없으면)) "</li>"
    comment.js:265  htmlComment += "<li><div class=\"reply show\">"   ← class 없는 래퍼
    comment.js:271  htmlComment += "<li id=\"reply_li_N\" class=\"ub-content\">"

  HTML 파서는 열린 <li> 안에 <li> 가 오면 앞의 것을 자동으로 닫으므로, 브라우저가
  만드는 `.cmt_list` 의 자식은 아래처럼 평면이 된다:
    li#comment_li_1.ub-content / li(클래스 없음) / li#comment_li_2.ub-content / ...

  그래서 `:scope > li.ub-content` 로 댓글만 골라 appendChild 로 옮기면 클래스 없는
  답글 래퍼만 제자리에 남아 대댓글 전체가 목록 맨 위로 올라간다. 이 파일은 그
  버그가 다시 들어오지 않는지 확인하는 용도다. 들여쓰기를 "정리"하지 말 것.
-->
