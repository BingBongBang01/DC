<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Ultimate</title>
  <link rel="stylesheet" href="../theme/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon" style="display:flex;align-items:center;justify-content:center;background:none;padding:0;"><img src="../../../assets/icons/sffgal_logo_white.svg" alt="DC" style="width:100%;height:100%;object-fit:contain;"></div>
        <div class="brand-info">
          <h1>DC Ultimate</h1>
          <span class="version">v2.0.0</span>
        </div>
      </div>
      <button id="btn-options" class="icon-btn" title="설정">⚙️</button>
    </header>

    <!-- Page Detector Info Card -->
    <section class="card status-card">
      <div class="card-header">
        <span class="card-title">현재 감지된 페이지</span>
        <span id="page-badge" class="badge">검사 중...</span>
      </div>
      <div class="card-body">
        <div class="info-row">
          <span class="label">갤러리:</span>
          <span id="info-gallery" class="value">-</span>
        </div>
        <div class="info-row">
          <span class="label">갤러리 종류:</span>
          <span id="info-type" class="value">-</span>
        </div>
      </div>
    </section>

    <!-- Theme Mode -->
    <section class="card">
      <div class="card-title mb-2">테마 · DC 야간모드 연동</div>
      <div class="theme-mode-group" id="theme-mode-group" role="group" aria-label="테마 모드">
        <button type="button" class="theme-mode-btn" data-mode="light">라이트</button>
        <button type="button" class="theme-mode-btn" data-mode="dark">다크</button>
        <button type="button" class="theme-mode-btn" data-mode="system">시스템</button>
      </div>
      <div class="control-row" style="margin-top: 8px;">
        <span style="font-size: 11px;">디시인사이드 야간모드에 함께 적용</span>
        <div id="switch-dc-dark"></div>
      </div>
    </section>

    <!-- Core Features Quick Controls -->
    <section class="card">
      <div class="card-title mb-2">핵심 코어 스위치</div>
      
      <div class="control-row">
        <span>테스트 피처 (Core Validation)</span>
        <div id="switch-test-feature"></div>
      </div>

      <div class="control-row">
        <span>클린 UI 모드</span>
        <div id="switch-clean-ui"></div>
      </div>

      <div class="control-row">
        <span>미리보기 팝업</span>
        <div id="switch-preview"></div>
      </div>

      <div class="control-row">
        <span>자짤 자동 첨부</span>
        <div id="switch-auto-sig"></div>
      </div>

      <div class="control-row" style="margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--border-color);">
        <span style="font-size: 11px;">아이콘 클릭 시 팝업 대신 사이드 패널 열기</span>
        <div id="switch-opt-sidepanel"></div>
      </div>
    </section>

    <!-- Quick Actions -->
    <footer class="footer">
      <button id="btn-open-sidepanel" class="btn btn-primary">사이드 패널 열기</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
